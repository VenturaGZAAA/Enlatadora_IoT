; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32@8.0.0
monitor_speed = 115200
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi     ; or qio_qspi for QSPI
framework = arduino
extra_scripts = post:post_upload.py
board_build.partitions = min_spiffs.csv
lib_ldf_mode = deep
build_unflags = -std=gnu++11 -std=gnu++14 -std=c++11 -std=c++14
build_flags = -std=gnu++17
              -DUSE_SD_CARD_MANAGER
              -DBOARD_HAS_PSRAM
              -Isrc
              -Isrc/config
;              -mfix-esp32-psram-cache-issue
lib_deps =
    symlink://lib/EspManagers/Monitor
    symlink://lib/EspManagers/SerialManager
    symlink://lib/EspManagers/WifiManager
    symlink://lib/EspManagers/WebServerManager
    symlink://lib/EspManagers/EvenTheRGBLedHasManagers
    symlink://lib/EspManagers/SdCardManager
    symlink://lib/EspManagers/MqttManager

